[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapat"
dynamic = ["version"]
description = "Multi-provider speech-to-text transcription CLI tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "click",
    "requests",
    "python-dotenv",
    "openai",
    "halo"
]

[project.scripts]
sapat = "sapat.cli:main"

[project.optional-dependencies]
oracle = ["oci>=2.126.0"]
vosk = ["vosk"]
moonshine = ["moonshine-voice"]
whisperx = ["whisperx"]
faster-whisper = ["faster-whisper"]
picovoice = ["pvleopard"]
replicate = ["replicate"]
falai = ["fal-client"]
all = [
    "sapat[oracle]",
    "sapat[vosk]",
    "sapat[moonshine]",
    "sapat[whisperx]",
    "sapat[faster-whisper]",
    "sapat[picovoice]",
    "sapat[replicate]",
    "sapat[falai]",
]
dev = ["pytest", "pytest-mock", "black", "isort"]

[tool.setuptools.packages.find]
include = ["sapat"]

[tool.setuptools.dynamic]
version = {attr = "sapat.__version__.__version__"}

[project.urls]
Homepage = "https://github.com/nibzard/sapat"
